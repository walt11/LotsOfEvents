plugins { id 'com.android.application' }
android {
 namespace 'net.jwalter.lotsofevents'
 compileSdk 35
 defaultConfig { applicationId 'net.jwalter.lotsofevents'; minSdk 31; targetSdk 35; versionCode 1; versionName '0.1'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'net.sf.biweekly:biweekly:0.6.8'
 androidTestImplementation 'androidx.test:runner:1.5.2'
 androidTestImplementation 'androidx.test.ext:junit:1.1.5'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
