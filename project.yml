name: LotsOfEvents
options:
  bundleIdPrefix: com.walt
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    INFOPLIST_KEY_CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
    INFOPLIST_KEY_CFBundleShortVersionString: '$(MARKETING_VERSION)'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 76BJCJ4Q7X
    APP_GROUP: group.com.walt.LotsOfEvents
    GENERATE_INFOPLIST_FILE: YES
targets:
  LotsOfEvents:
    type: application
    platform: iOS
    sources: [LotsOfEvents, Shared]
    dependencies:
      - target: AgendaWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walt.LotsOfEvents
        INFOPLIST_KEY_CFBundleDisplayName: LotsOfEvents
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: LotsOfEvents/Info.plist
      properties:
        AgendaAppGroup: $(APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCalendarsFullAccessUsageDescription: Show your selected calendars in your agenda and widget, and create events.
        NSRemindersFullAccessUsageDescription: Show reminders from the lists you select in your agenda and widget.
        NSMicrophoneUsageDescription: Dictate events and reminders into the Quick Add text box.
        NSSpeechRecognitionUsageDescription: Turn your spoken words into editable Quick Add text.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [lotsofevents]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: LotsOfEvents/LotsOfEvents.entitlements
      properties:
        com.apple.security.application-groups: ['$(APP_GROUP)']
  AgendaWidget:
    type: app-extension
    platform: iOS
    sources: [AgendaWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walt.LotsOfEvents.AgendaWidget
        INFOPLIST_KEY_CFBundleDisplayName: Upcoming Agenda
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: AgendaWidget/Info.plist
      properties:
        AgendaAppGroup: $(APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCalendarsFullAccessUsageDescription: Show selected events in your widget.
        NSRemindersFullAccessUsageDescription: Show selected reminders in your widget.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AgendaWidget/AgendaWidget.entitlements
      properties:
        com.apple.security.application-groups: ['$(APP_GROUP)']
  LotsOfEventsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LotsOfEventsTests]
    dependencies:
      - target: LotsOfEvents
schemes:
  LotsOfEvents:
    build:
      targets:
        LotsOfEvents: all
    test:
      targets: [LotsOfEventsTests]
