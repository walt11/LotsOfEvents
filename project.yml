name: LotsOfEvents
options:
  bundleIdPrefix: com.walt
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CURRENT_PROJECT_VERSION: 28
    MARKETING_VERSION: 1.1
    INFOPLIST_KEY_CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
    INFOPLIST_KEY_CFBundleShortVersionString: '$(MARKETING_VERSION)'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 76BJCJ4Q7X
    APP_GROUP: group.com.walt.LotsOfEvents
    GENERATE_INFOPLIST_FILE: YES
targets:
  LotsOfEvents:
    type: application
    platform: iOS
    sources:
      - LotsOfEvents
      - Shared
      # The widget views, so Settings can preview them; the widget bundle and its extension-only files stay out.
      - path: AgendaWidget
        excludes: [WidgetBundle.swift, QuickAddControls.swift, TodayRemindersWidget.swift, NextEventLiveActivity.swift, Info.plist, AgendaWidget.entitlements]
    dependencies:
      - target: AgendaWidget
      - target: ShareExtension
      # The watch app ships only with the iPhone app, not the Mac one.
      - target: LotsOfEventsWatch
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walt.LotsOfEvents
        # Also builds as a Mac app with Mac Catalyst.
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # The Mac runs apps and widgets in the App Sandbox; these grant what each one uses there.
        ENABLE_APP_SANDBOX[sdk=macosx*]: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS[sdk=macosx*]: YES
        ENABLE_RESOURCE_ACCESS_CALENDARS[sdk=macosx*]: YES
        ENABLE_RESOURCE_ACCESS_LOCATION[sdk=macosx*]: YES
        ENABLE_RESOURCE_ACCESS_CONTACTS[sdk=macosx*]: YES
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT[sdk=macosx*]: YES
        ENABLE_USER_SELECTED_FILES[sdk=macosx*]: readonly
        INFOPLIST_KEY_CFBundleDisplayName: LotsOfEvents
        "INFOPLIST_KEY_LSApplicationCategoryType[sdk=macosx*]": public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Light AppIcon-Dark AppIcon-Midnight AppIcon-Forest AppIcon-Studio
    info:
      path: LotsOfEvents/Info.plist
      properties:
        AgendaAppGroup: $(APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only Apple's built-in encryption is used, so App Store Connect skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: Show your selected calendars in your agenda and widget, and create events.
        NSRemindersFullAccessUsageDescription: Show reminders from the lists you select in your agenda and widget.
        NSMicrophoneUsageDescription: Dictate events and reminders into the Quick Add text box.
        NSSpeechRecognitionUsageDescription: Turn your spoken words into editable Quick Add text.
        NSLocationWhenInUseUsageDescription: Show the weather forecast in your calendar and work out when to leave for events.
        NSContactsUsageDescription: Show birthdays, anniversaries, and other contact dates in your calendar, agenda, and widgets, and optionally show birthday ages.
        # The next-event countdown on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [lotsofevents]
        # Puts the app in the share sheet for .ics files (Mail, Messages, Files, Safari), to add their events.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Calendar Event
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.ical.ics, public.calendar-event]
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: LotsOfEvents/LotsOfEvents.entitlements
      properties:
        com.apple.security.application-groups: ['$(APP_GROUP)']
        com.apple.developer.weatherkit: true
  AgendaWidget:
    type: app-extension
    platform: iOS
    sources: [AgendaWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walt.LotsOfEvents.AgendaWidget
        # Also builds as a Mac app with Mac Catalyst.
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # The Mac runs apps and widgets in the App Sandbox; these grant what each one uses there.
        ENABLE_APP_SANDBOX[sdk=macosx*]: YES
        ENABLE_RESOURCE_ACCESS_CALENDARS[sdk=macosx*]: YES
        INFOPLIST_KEY_CFBundleDisplayName: Upcoming Agenda
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: AgendaWidget/Info.plist
      properties:
        AgendaAppGroup: $(APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCalendarsFullAccessUsageDescription: Show selected events in your widget.
        NSRemindersFullAccessUsageDescription: Show selected reminders in your widget.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AgendaWidget/AgendaWidget.entitlements
      properties:
        com.apple.security.application-groups: ['$(APP_GROUP)']
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
      - LotsOfEvents/ICSImport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walt.LotsOfEvents.ShareExtension
        # Also builds as a Mac app with Mac Catalyst.
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # The Mac runs apps and widgets in the App Sandbox; these grant what each one uses there.
        ENABLE_APP_SANDBOX[sdk=macosx*]: YES
        ENABLE_RESOURCE_ACCESS_CALENDARS[sdk=macosx*]: YES
        ENABLE_USER_SELECTED_FILES[sdk=macosx*]: readonly
        INFOPLIST_KEY_CFBundleDisplayName: LotsOfEvents
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: LotsOfEvents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCalendarsFullAccessUsageDescription: Add events from shared calendar files to your calendars.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Shown for calendar files (.ics) from any app, and for nothing else.
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $file,
              ANY $file.registeredTypeIdentifiers UTI-CONFORMS-TO "public.calendar-event"
              OR ANY $file.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.ical.ics").@count > 0).@count > 0
  LotsOfEventsWatch:
    type: application
    platform: watchOS
    deploymentTarget: '11.0'
    sources: [LotsOfEventsWatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walt.LotsOfEvents.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: LotsOfEventsWatch/Info.plist
      properties:
        CFBundleDisplayName: LotsOfEvents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.walt.LotsOfEvents
        NSCalendarsFullAccessUsageDescription: Show your upcoming events on your watch.
        NSRemindersFullAccessUsageDescription: Show today's reminders on your watch.
  LotsOfEventsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LotsOfEventsTests]
    dependencies:
      - target: LotsOfEvents
schemes:
  LotsOfEvents:
    build:
      targets:
        LotsOfEvents: all
    test:
      targets: [LotsOfEventsTests]
